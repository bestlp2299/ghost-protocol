<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Protocol // Astra AI Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #030303; color: #f4f4f5; height: 100dvh; max-height: 100dvh; overflow: hidden; display: flex; flex-direction: column; user-select: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .gp-header { height: 56px; border-bottom: 1px solid rgba(153, 27, 27, 0.4); background: rgba(7, 7, 7, 0.9); backdrop-filter: blur(12px); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; z-index: 30; flex-shrink: 0; }
        .gp-nav { height: 60px; background: #050505; border-top: 1px solid rgba(153, 27, 27, 0.4); padding: 0 16px; display: flex; align-items: center; justify-content: space-around; z-index: 30; flex-shrink: 0; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; cursor: pointer; color: #71717a; }
        .nav-btn.active { color: #ef4444; }
        .view-content { position: absolute; inset: 0; bottom: 60px; display: flex; flex-direction: column; background: #030303; }
        .hidden-view { display: none !important; }
        .gp-card { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(153, 27, 27, 0.5); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
        .gp-button { background: #dc2626; color: white; font-weight: bold; border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .gp-input { width: 100%; background: #000000; border: 1px solid rgba(153, 27, 27, 0.6); border-radius: 12px; padding: 12px 16px; color: #f4f4f5; outline: none; font-size: 14px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; padding: 24px; text-align: center; }
    </style>
</head>
<body>
    <header class="gp-header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 32px; height: 32px; border-radius: 12px; background: black; border: 1px solid #dc2626; display: flex; align-items: center; justify-content: center;">
                <svg style="width: 20px; height: 20px;" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="75" fill="black" stroke="#DC2626" stroke-width="6"/>
                    <path d="M98 72H78C71.4 72 66 77.4 66 84V116C66 122.6 71.4 128 78 128H98V108H86" stroke="#EF4444" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M110 72V128M110 72H122C130.8 72 138 79.2 138 88C138 96.8 130.8 104 122 104H110" stroke="#EF4444" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span style="font-weight: bold; letter-spacing: 2px; color: #ef4444; font-size: 11px; font-family: monospace;">GHOST PROTOCOL</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span id="p2p-status-badge" style="font-size: 10px; font-family: monospace; color: #f59e0b; background: rgba(120, 53, 15, 0.3); padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(180, 83, 9, 0.5);">P2P: ONLINE</span>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #34d399;"></div>
        </div>
    </header>

    <main style="flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column;">
        <!-- Чаты -->
        <div id="view-chats" class="view-content" style="display: flex; padding: 16px; overflow-y: auto;">
            <div onclick="openChat('ChatGPT Astra', true, 'astra')" class="gp-card" style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
                <div>
                    <div style="font-weight: bold; font-size: 14px; color: #f4f4f5; font-family: monospace;">ChatGPT Astra</div>
                    <div style="font-size: 12px; color: #a1a1aa;">Безлимитный ИИ-ассистент</div>
                </div>
                <span style="font-size: 10px; color: #34d399; font-family: monospace;">FREE</span>
            </div>
        </div>

        <!-- Друзья -->
        <div id="view-friends" class="view-content hidden-view" style="padding: 16px; overflow-y: auto; gap: 16px;">
            <h2 style="font-size: 13px; font-weight: bold; color: #ef4444; font-family: monospace;">Контакты & P2P Сеть</h2>
            <div class="gp-card">
                <div style="font-size: 10px; color: #a1a1aa; font-family: monospace;">Ваш сетевой код:</div>
                <div id="my-peer-id" style="font-weight: bold; font-size: 13px; color: #f87171; font-family: monospace; margin: 8px 0;">Загрузка...</div>
                <button onclick="copyMyId()" class="gp-button" style="width: 100%;">Копировать код</button>
            </div>
        </div>

        <!-- Бункер -->
        <div id="view-secure" class="view-content hidden-view" style="padding: 24px; align-items: center; justify-content: center; text-align: center; gap: 24px;">
            <h2 style="font-size: 18px; font-weight: bold; color: #f4f4f5; font-family: monospace;">БУНКЕР</h2>
            <button onclick="nukeData()" class="gp-button" style="width: 100%;">Очистить данные</button>
        </div>

        <!-- Настройки -->
        <div id="view-settings" class="view-content hidden-view" style="padding: 16px;">
            <h2 style="font-size: 13px; font-weight: bold; color: #ef4444; font-family: monospace;">НАСТРОЙКИ</h2>
        </div>

        <!-- Чат -->
        <div id="view-active-chat" class="view-content hidden-view" style="z-index: 20;">
            <div class="gp-header">
                <button onclick="closeChat()" style="background: none; border: none; color: #a1a1aa; cursor: pointer;"><i data-lucide="arrow-left"></i></button>
                <span id="active-chat-title" style="font-weight: bold; font-family: monospace; color: #fff;">Чат</span>
                <div></div>
            </div>
            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;"></div>
            <div style="padding: 12px; background: #050505; display: flex; gap: 8px;">
                <input type="text" id="chat-input" placeholder="Сообщение..." class="gp-input" onkeypress="if(event.key === 'Enter') handleSendMessageButton()">
                <button onclick="handleSendMessageButton()" class="gp-button">Отправить</button>
            </div>
        </div>
    </main>

    <nav class="gp-nav">
        <button onclick="switchTab('chats')" id="nav-chats" class="nav-btn active"><i data-lucide="message-square"></i><span style="font-size: 10px;">Чаты</span></button>
        <button onclick="switchTab('friends')" id="nav-friends" class="nav-btn"><i data-lucide="users"></i><span style="font-size: 10px;">Друзья</span></button>
        <button onclick="switchTab('secure')" id="nav-secure" class="nav-btn"><i data-lucide="flame"></i><span style="font-size: 10px;">Бункер</span></button>
        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn"><i data-lucide="settings"></i><span style="font-size: 10px;">Настройки</span></button>
    </nav>

    <script>
        lucide.createIcons();
        let peer = new Peer('ghost-' + Math.floor(1000 + Math.random() * 9000));
        peer.on('open', (id) => { document.getElementById('my-peer-id').innerText = id; });

        function switchTab(tab) {
            document.querySelectorAll('.view-content').forEach(el => el.classList.add('hidden-view'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + tab).classList.remove('hidden-view');
            document.getElementById('nav-' + tab).classList.add('active');
            lucide.createIcons();
        }

        function openChat(title, isAi, type) {
            document.getElementById('active-chat-title').innerText = title;
            document.getElementById('view-active-chat').classList.remove('hidden-view');
        }

        function closeChat() { document.getElementById('view-active-chat').classList.add('hidden-view'); }

        function copyMyId() {
            navigator.clipboard.writeText(document.getElementById('my-peer-id').innerText);
            alert("Код скопирован");
        }

        function nukeData() {
            document.getElementById('chat-messages').innerHTML = '';
            alert("Данные стерты.");
        }

        async function handleSendMessageButton() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            const container = document.getElementById('chat-messages');
            container.innerHTML += `<div style="align-self: flex-end; background: #dc2626; padding: 10px; border-radius: 12px; color: white;">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
